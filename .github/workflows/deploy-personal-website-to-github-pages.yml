name: 发布个人主页到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - projects/personal-website/public/**
      - projects/personal-website/tests/**
      - .github/workflows/deploy-personal-website-to-github-pages.yml
  pull_request:
    branches: [main]
    paths:
      - projects/personal-website/public/**
      - projects/personal-website/tests/**
      - .github/workflows/deploy-personal-website-to-github-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-website-github-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: 验证并打包静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 读取已提交源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 配置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: 验证语言入口和公开内容
        run: node --test projects/personal-website/tests/*.test.mjs
      - name: 仅打包个人站点公开目录
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: projects/personal-website/public

  deploy:
    name: 发布静态站点
    if: github.event_name != 'pull_request'
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取 Pages 配置
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 发布已验证工件
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
